apiVersion: apps/v1
kind: Deployment

metadata:
  name: recommendation-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: recommendation

  template:
    metadata:
      labels:
        app: recommendation

    spec:
      containers:
      - name: recommendation

        image: yourdockerhub/recommendation-service:v1

        ports:
        - containerPort: 8000