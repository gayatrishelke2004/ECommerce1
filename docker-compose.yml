services:

  postgres:
    image: postgres:15

    environment:
      POSTGRES_DB: retaildb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  mongodb:
    image: mongo:7

    ports:
      - "27017:27017"

  auth-service:
    build: ./services/auth-service

    ports:
      - "8001:8000"

    depends_on:
      - postgres

  product-service:
    build: ./services/product-service

    ports:
      - "8002:8000"

    depends_on:
      - postgres

  user-service:
    build: ./services/user-service

    ports:
      - "8003:8003"

    depends_on:
      - postgres

  search-service:
    build: ./services/search-service

    ports:
      - "8004:8004"

    depends_on:
      - postgres

  recommendation-service:
    build: ./services/recommendation-service

    ports:
      - "8005:8000"

    environment:
      MONGO_URI: mongodb://mongodb:27017

    depends_on:
      - mongodb
  frontend:
    build: ./frontend

    ports:
      - "3000:80"

    depends_on:
      - auth-service
      - product-service
      - user-service
      - search-service
      - recommendation-service      